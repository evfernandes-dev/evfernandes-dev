<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" role="img" aria-label="Repositories by language: 16 repositories, top language Python with 50%">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224" />
      <stop offset="1" stop-color="#060a16" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#8a2be2" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3572A5" />
      <stop offset="1" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="barsClip">
      <rect x="310" y="46" width="262" height="170" rx="4" />
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bar { animation: barPulse 5s ease-in-out infinite; }
    .ring { animation: ringPulse 4s ease-in-out infinite; }
    .orbit { transform-origin: 100px 128px; animation: orbit 9s linear infinite; }
    .shine { animation: shineMove 5.5s linear infinite; }
    .dust { animation: dustFloat 7s ease-in-out infinite; opacity: .2; }
    .border { animation: borderPulse 4s ease-in-out infinite; }
    .accent { animation: accentPulse 3.6s ease-in-out infinite; }
    @keyframes barPulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
    @keyframes ringPulse { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }
    @keyframes orbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes shineMove { 0% { transform: translateX(-90px); } 100% { transform: translateX(300px); } }
    @keyframes dustFloat { 0%, 100% { transform: translateY(0); opacity: .18; } 50% { transform: translateY(-7px); opacity: .6; } }
    @keyframes borderPulse { 0%, 100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    @keyframes accentPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <rect class="border" x="0.5" y="0.5" width="699" height="229" rx="12" fill="url(#panel)" stroke="#17304d" />
  <rect class="accent" x="18" y="14" width="48" height="2" rx="1" fill="url(#accent)" />

  <text x="18" y="32" fill="#7be9ff" font-size="10" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="2.4" filter="url(#glow)">REPOS BY LANGUAGE</text>
  <text x="18" y="47" fill="#5d7e95" font-size="8" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0.8">NON-FORK &#183; PRIMARY LANGUAGE</text>

  <circle cx="100" cy="128" r="42" fill="none" stroke="#142033" stroke-width="9" />
  <circle class="ring" cx="100" cy="128" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="9" stroke-linecap="round" stroke-dasharray="131.9 263.9" transform="rotate(-90 100 128)" filter="url(#glow)" />
  <circle class="orbit" cx="100" cy="86" r="2.2" fill="#00e5ff" filter="url(#glow)" />

  <text x="100" y="134" text-anchor="middle" fill="#eafcff" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="800">16</text>
  <text x="100" y="150" text-anchor="middle" fill="#7fa6bd" font-size="7" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">REPOS</text>
  <text x="100" y="194" text-anchor="middle" fill="#7be9ff" font-size="8.5" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="0.6">PYTHON &#183; 50%</text>

  <g>
    
    <g>
      <circle cx="212" cy="68" r="3" fill="#3572A5" />
      <text x="222" y="71" fill="#cfe9ff" font-size="9.2" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Python</text>
      <rect x="310" y="64" width="250" height="8" rx="4" fill="#101a2d" />
      <rect class="bar" x="310" y="64" width="250.0" height="8" rx="4" fill="#3572A5" filter="url(#glow)" style="animation-delay:0.00s">
        <title>Python: 8 repositories (50%)</title>
      </rect>
      <rect x="310" y="64" width="250.0" height="2.5" rx="1.2" fill="#ffffff" opacity="0.18" />
      <text x="682" y="71" text-anchor="end" fill="#7fa6bd" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">8 &#183; 50%</text>
    </g>

    <g>
      <circle cx="212" cy="98" r="3" fill="#b07219" />
      <text x="222" y="101" fill="#cfe9ff" font-size="9.2" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Java</text>
      <rect x="310" y="94" width="250" height="8" rx="4" fill="#101a2d" />
      <rect class="bar" x="310" y="94" width="125.0" height="8" rx="4" fill="#b07219" filter="url(#glow)" style="animation-delay:-0.55s">
        <title>Java: 4 repositories (25%)</title>
      </rect>
      <rect x="310" y="94" width="125.0" height="2.5" rx="1.2" fill="#ffffff" opacity="0.18" />
      <text x="682" y="101" text-anchor="end" fill="#7fa6bd" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">4 &#183; 25%</text>
    </g>

    <g>
      <circle cx="212" cy="128" r="3" fill="#f1e05a" />
      <text x="222" y="131" fill="#cfe9ff" font-size="9.2" font-family="Segoe UI, Arial, sans-serif" font-weight="600">JavaScript</text>
      <rect x="310" y="124" width="250" height="8" rx="4" fill="#101a2d" />
      <rect class="bar" x="310" y="124" width="62.5" height="8" rx="4" fill="#f1e05a" filter="url(#glow)" style="animation-delay:-1.10s">
        <title>JavaScript: 2 repositories (13%)</title>
      </rect>
      <rect x="310" y="124" width="62.5" height="2.5" rx="1.2" fill="#ffffff" opacity="0.18" />
      <text x="682" y="131" text-anchor="end" fill="#7fa6bd" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">2 &#183; 13%</text>
    </g>

    <g>
      <circle cx="212" cy="158" r="3" fill="#563d7c" />
      <text x="222" y="161" fill="#cfe9ff" font-size="9.2" font-family="Segoe UI, Arial, sans-serif" font-weight="600">CSS</text>
      <rect x="310" y="154" width="250" height="8" rx="4" fill="#101a2d" />
      <rect class="bar" x="310" y="154" width="31.3" height="8" rx="4" fill="#563d7c" filter="url(#glow)" style="animation-delay:-1.65s">
        <title>CSS: 1 repository (6%)</title>
      </rect>
      <rect x="310" y="154" width="31.3" height="2.5" rx="1.2" fill="#ffffff" opacity="0.18" />
      <text x="682" y="161" text-anchor="end" fill="#7fa6bd" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">1 &#183; 6%</text>
    </g>

    <g>
      <circle cx="212" cy="188" r="3" fill="#3178c6" />
      <text x="222" y="191" fill="#cfe9ff" font-size="9.2" font-family="Segoe UI, Arial, sans-serif" font-weight="600">TypeScript</text>
      <rect x="310" y="184" width="250" height="8" rx="4" fill="#101a2d" />
      <rect class="bar" x="310" y="184" width="31.3" height="8" rx="4" fill="#3178c6" filter="url(#glow)" style="animation-delay:-2.20s">
        <title>TypeScript: 1 repository (6%)</title>
      </rect>
      <rect x="310" y="184" width="31.3" height="2.5" rx="1.2" fill="#ffffff" opacity="0.18" />
      <text x="682" y="191" text-anchor="end" fill="#7fa6bd" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">1 &#183; 6%</text>
    </g>
  </g>

  <g clip-path="url(#barsClip)">
    <rect class="shine" x="310" y="46" width="70" height="170" fill="url(#shineGrad)" />
  </g>

  <circle class="dust" cx="58" cy="74" r="1.8" fill="#00e5ff" style="animation-delay:-0.0s" />
  <circle class="dust" cx="146" cy="196" r="1.2" fill="#00e5ff" style="animation-delay:-0.9s" />
  <circle class="dust" cx="250" cy="40" r="1.8" fill="#00e5ff" style="animation-delay:-1.8s" />
  <circle class="dust" cx="430" cy="204" r="1.2" fill="#00e5ff" style="animation-delay:-2.7s" />
  <circle class="dust" cx="560" cy="36" r="1.8" fill="#00e5ff" style="animation-delay:-3.6s" />
  <circle class="dust" cx="648" cy="160" r="1.2" fill="#00e5ff" style="animation-delay:-4.5s" />
  <circle class="dust" cx="300" cy="214" r="1.8" fill="#00e5ff" style="animation-delay:-5.4s" />
  <circle class="dust" cx="680" cy="72" r="1.2" fill="#00e5ff" style="animation-delay:-6.3s" />
</svg>
